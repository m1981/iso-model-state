# Model stanów produktów pracy (ISO/IEC 29110-5-1-2, profil Basic) dla zespołu „użytkownik i agent LLM”.
# Jedno źródło dla: dowodów TLA+ (E3), testów pytest i Hypothesis (E2), programu sprawdzającego repozytoria (E5).
# Identyfikatory po angielsku, w terminologii normy (DEC-PRO-002). Opisy (`description`) po polsku.

model: iso29110-basic-process
version: 0.6
status: approved              # DEC-PRO-009: następcy, powiązania i zakres; nie oznacza dowodu G/S/L

notation:
  e: "element, którego dotyczy przejście"
  q: "pytanie, którego dotyczy przejście"
  n: "lokalny skrót numeru bieżącego wydania sprzed W06; nie jest zmienną trwałą"
  type(e): "typ elementu z sekcji item_types"
  deps(e): "elementy, od których e zależy bezpośrednio"
  dependents(e): "elementy, które zależą od e bezpośrednio i pośrednio"
  release: "releases[current_release]: bieżący rekord wydania; zmiana wskaźnika nie zmienia poprzedniego rekordu"
  release_scope: "release.scope: zbiór ID rozpatrywanych w bieżącym wydaniu, także elementów wyłączonych z dostawy"
  in_scope(e): "e.id należy do release.scope"
  snapshot(scope): "kopia wartości type, depends_on i wszystkich item_variables elementów z scope; nie referencje do żywych elementów"
  newly_suspect: "zbiór elementów, dla których suspect zmieniło się z false na true w danym kroku"
  checks_ok(e): "reguły śledzenia powiązań i testy elementu przechodzą (założone, nie modelowane)"
  tests_ok: "pełny przebieg testów przechodzi (założone, nie modelowane)"
  authorized_change(q,e): "predykat question_semantics.authorized_change; q wskazane w zdarzeniu, transition to wykonywane przejście"
  answer_resolution(q): "dla change jawny wynik approved/rejected z wejścia kroku; dla general answered; nie klasyfikuje tekstu"
  arguments: "deklaracje argumentów przejścia: pole zdarzenia -> bind (nazwa w wyrażeniu), type (item albo optional_item_id); default=none tylko dla optional_item_id; brak obowiązkowego argumentu jest błędem wejścia"
  item(id): "rekord z katalogu po ID; none daje pusty rekord z id/state/type=none, bez zależności; nieznane ID jest błędem wejścia"
  predecessor(e): "item(e.predecessor); odwołanie historyczne, nie krawędź zależności"
  dependency_types_ok(e, ids): "ids jest zbiorem bez duplikatów, każde ID istnieje w katalogu, zbiór typów odpowiada item_types[e.type].depends_on"
  acyclic_dependencies(e, ids): "graf roboczy, w którym zależności e zastąpiono przez ids, nie zawiera cyklu; brak ID lub niepoprawny zbiór daje false"
  pre_dependents(e): "przechodni zależni e w grafie sprzed kroku; skutki dotyczą ich rekordów po kroku"
  "X union Y": "suma zbiorów ID, serializowana deterministycznie bez duplikatów"
  "X minus Y": "różnica zbiorów ID, serializowana deterministycznie bez duplikatów"
  "x in S": "stan x należy do zbioru S"

parameters:
  MAX_REJECTIONS: 2           # ile razy użytkownik może odrzucić jedną wersję elementu (INT-011)

actors:
  U:
    name: user
    iso_roles: [CUS, PJM]     # INT-009: klient i kierownik projektu to jedna osoba
  A:
    name: author_agent
    iso_roles: [AN, DES, PR, TL]
  R:
    name: reviewer_agent
    iso_roles: []
    description: "osobny przebieg agenta bez historii tworzenia; niezależna weryfikacja (SI.O7, uwaga 2)"

# ---------------------------------------------------------------------------
# Elementy (produkty pracy prowadzone jako elementy z ID)
# ---------------------------------------------------------------------------

item_states:
  draft:      {iso: [Initiated, Preliminary, Corrected], active: true,  final: false}
  verified:   {iso: [Verified, Evaluated],              active: true,  final: false}
  approved:   {iso: [Approved, Validated, Reviewed],    active: true,  final: false}
  baselined:  {iso: [Baselined],                        active: true,  final: false}
  deferred:   {iso: [Postponed/deferred],               active: false, final: false}
  superseded: {iso: [Deleted],                          active: false, final: true}
  withdrawn:  {iso: [Cancelled, Rejected],              active: false, final: true}

item_variables:
  state:      {type: item_states, initial: none, description: "none = element jeszcze nie istnieje"}
  depends_on: {type: item_id_set, initial: "test_instance.items[e.id].depends_on", description: "bieżące powiązania; po inicjalizacji zmienia je wyłącznie T14"}
  predecessor: {type: optional_item_id, initial: none, description: "historyczny poprzednik zapisany w T00, potem niezmienny; nie jest zależnością budowania"}
  version:    {type: int, initial: 0}
  rejections: {type: "0..MAX_REJECTIONS", initial: 0, description: "liczba odrzuceń bieżącej wersji"}
  suspect:    {type: bool, initial: false, description: "zależność zmieniła się po ostatnim przeglądzie elementu (INT-012)"}

item_types:
  PLAN: {iso_wp: [WP.02, WP.10], depends_on: [],          requires_approval: true,  description: "umowa i plan projektu (karta projektu)"}
  REQ:  {iso_wp: [WP.13],        depends_on: [PLAN],      requires_approval: true}
  AT:   {iso_wp: [WP.19],        depends_on: [REQ],       requires_approval: true,  description: "scenariusz akceptacyjny"}
  DES:  {iso_wp: [WP.16],        depends_on: [REQ],       requires_approval: false, description: "decyzje agenta, do podważenia przez T06 (INT-013)"}
  CODE: {iso_wp: [WP.14, WP.15], depends_on: [DES, AT],   requires_approval: false, description: "verified = testy przechodzą; zatwierdzenie przez odbiór wydania"}

item_transitions:
  - id: T00
    name: create
    from: [none]
    to: draft
    actor: A
    arguments:
      predecessor: {bind: proposed_predecessor, type: optional_item_id, default: none}
    guard: "dependency_types_ok(e, e.depends_on) and acyclic_dependencies(e, e.depends_on) and (proposed_predecessor = none or (item(proposed_predecessor).state = superseded and item(proposed_predecessor).type = e.type and not item(proposed_predecessor).id = e.id))"
    effects: ["version := 1", "predecessor := proposed_predecessor"]
    iso: [SI.02.02, SI.03.03, SI.03.06, SI.04.03, PM.01.11, PM.01.09, PM.O5]

  - id: T01
    name: verify
    from: [draft]
    to: verified
    actor: A
    guard: "not suspect and checks_ok(e) and forall d in deps(e): d.state in {approved, baselined}"
    effects: []
    iso: [SI.02.04, SI.03.05, SI.03.08, SI.04.05, PM.01.13, PM.O7, SI.O1, SI.O4]
    description: "zależności muszą być zatwierdzone; zapobiega budowaniu na niezatwierdzonym"

  - id: T02
    name: approve
    from: [verified]
    to: approved
    actor: U
    guard: "type(e).requires_approval and not suspect"
    effects: []
    evidence: "DEC z cytatem użytkownika"
    iso: [SI.02.05, PM.01.14, PM.02.03, PM.O1]

  - id: T03
    name: reject
    from: [verified]
    to: draft
    actor: U
    guard: "rejections < MAX_REJECTIONS"
    effects: ["rejections := rejections + 1"]
    iso: [SI.02.05]
    description: "„popraw, aż zatwierdzi”; po MAX_REJECTIONS odrzuceniach zostają T02, T07, T08, T09 (eskalacja)"

  - id: T04
    name: baseline
    from: [approved, verified]
    to: baselined
    actor: U
    guard: "not suspect and (state = approved or not type(e).requires_approval) and forall d in deps(e): d.state = baselined"
    effects: []
    evidence: "commit lub tag na polecenie użytkownika"
    iso: [SI.02.08, SI.03.09, SI.04.07, PM.01.16, PM.O6, SI.O2, SI.O3]

  - id: T05
    name: open_change
    from: [verified, approved, baselined]
    to: draft
    actor: U
    guard: "authorized_change(q,e)"
    effects: ["q.consumed := true", "version := version + 1", "rejections := 0", "suspect := false", "forall d in dependents(e): d.suspect := true", "invalidate_release(e)"]
    iso: [PM.02.02, PM.02.03, PM.03.03, PM.03.04]

  - id: T06
    name: challenge
    from: [verified, baselined]
    to: draft
    actor: U
    guard: "not type(e).requires_approval"
    effects: ["version := version + 1", "rejections := 0", "forall d in dependents(e): d.suspect := true", "invalidate_release(e)"]
    iso: [PM.02.05]
    description: "użytkownik podważa decyzję agenta (DES, CODE) bez formalnego pytania"

  - id: T07
    name: supersede
    from: [draft, verified, approved, baselined, deferred]
    to: superseded
    actor: U
    guard: "authorized_change(q,e)"
    effects: ["q.consumed := true", "forall d in dependents(e): d.suspect := true", "invalidate_release(e)"]
    iso: [PM.02.03, PM.03.04]
    description: "kandydat na następcę powstaje osobno przez T00(predecessor=e.id); wymaga własnej weryfikacji, zatwierdzenia i włączenia do zakresu przez U (INT-018)"

  - id: T08
    name: withdraw
    from: [draft, verified, approved, baselined, deferred]
    to: withdrawn
    actor: U
    guard: "true"
    effects: ["forall d in dependents(e): d.suspect := true", "invalidate_release(e)"]
    iso: [PM.02.03]

  - id: T09
    name: defer
    from: [draft, verified]
    to: deferred
    actor: U
    guard: "true"
    effects: ["invalidate_release(e)"]
    iso: [PM.03.04]

  - id: T10
    name: resume
    from: [deferred]
    to: draft
    actor: U
    guard: "true"
    effects: ["rejections := 0", "invalidate_release(e)"]
    iso: [PM.03.04]
    description: "DEC-PRO-004: wznowienie zmienia kompletność bieżącego zakresu; przed odbiorem cofa gotowość, po odbiorze wymusza W06"

  - id: T11
    name: review_no_impact
    from: [draft, verified, approved, baselined]
    to: "="                   # stan bez zmian
    actor: A
    guard: "suspect and forall d in deps(e): d.state in {approved, baselined} and not d.suspect"
    effects: ["suspect := false"]
    evidence: "wpis w kolumnie Przejrzane decyzji, która wywołała zmianę; decyzja agenta do podważenia"
    iso: [SI.03.04, SI.04.06]
    description: "DEC-PRO-009: przegląd bez wpływu dopiero przy dojrzałych zależnościach bez suspect; blokuje przedwczesny przegląd i naruszenie S4/S6"

  - id: T12
    name: raise_change
    from: [verified, approved, baselined]
    to: "="
    actor: A
    guard: "suspect"
    effects: ["create question(kind = change, about = e.id, about_version = e.version, requested_transition = T05, blocking = true, resolution = none, consumed = false)"]
    iso: [PM.02.02, PM.03.03, PM.O3]
    description: "zmiana treści elementu zaakceptowanego idzie przez użytkownika (T05)"

  - id: T13
    name: fix_draft
    from: [draft]
    to: draft
    actor: A
    guard: "suspect"
    effects: ["suspect := false"]
    iso: [SI.02.04, SI.03.05]
    description: "szkic agent poprawia sam, bez pytania"

  - id: T14
    name: relink_dependency
    from: [draft]
    to: draft
    actor: A
    arguments:
      old_dependency: {bind: old_dependency, type: item}
      new_dependency: {bind: new_dependency, type: item}
    guard: "release.state = in_preparation and old_dependency.id in e.depends_on and old_dependency.state = superseded and new_dependency.predecessor = old_dependency.id and new_dependency.state = baselined and not new_dependency.suspect and not old_dependency.id = new_dependency.id and new_dependency.id not in e.depends_on and not new_dependency.id = e.id and dependency_types_ok(e, (e.depends_on minus {old_dependency.id}) union {new_dependency.id}) and acyclic_dependencies(e, (e.depends_on minus {old_dependency.id}) union {new_dependency.id}) and (in_scope(e) => in_scope(new_dependency))"
    effects: ["depends_on := (depends_on minus {old_dependency.id}) union {new_dependency.id}", "forall d in pre_dependents(e): d.suspect := true", "invalidate_release(e)"]
    evidence: "wpis agenta: element, stara i nowa zależność oraz odwołanie do przeglądu"
    iso: [SI.03.04, SI.04.06]
    interpretation: INT-018
    description: "jawna naprawa jednej krawędzi szkicu; bez zwiększenia wersji i bez kasowania suspect; zależni z grafu sprzed kroku"

# ---------------------------------------------------------------------------
# Pytania i wnioski o zmianę (rejestr pytań)
# ---------------------------------------------------------------------------

question_states:
  open:     {final: false}
  asked:    {final: false}
  resolved: {final: true}
  deferred: {final: false}

question_variables:
  state:    {type: question_states, initial: none}
  blocking: {type: bool, description: "pytanie blokuje wydanie"}
  age:      {type: int, description: "kolejność zgłoszenia; do reguły FIFO"}

  kind: {type: enum, values: [general, change], initial: general}
  about: {type: optional_item_id, initial: none}
  about_version: {type: optional_int, initial: none}
  requested_transition: {type: optional_transition_id, initial: none}
  resolution: {type: enum, values: [none, approved, rejected, answered], initial: none}
  consumed: {type: bool, initial: false}

# DEC-PRO-008: formalny warunek czytany również przez wykonawcę.
question_semantics:
  change_operations: [T05, T07]
  authorized_change: "q.state = resolved and q.kind = change and q.resolution = approved and q.about = e.id and q.about_version = e.version and q.requested_transition = transition.id and not q.consumed"
  creation: "P00: general bez powiązania; change wymaga istniejącego about, operacji z change_operations i blocking=true; about_version pobierane z elementu przy zgłoszeniu; age=max(age)+1. T12 tworzy taki sam rekord open. ID nowego pytania dostarcza zdarzenie."
  answer: "P02: change wymaga jawnego approved/rejected; general ma answered. Dowód DEC zachowuje wynik i powiązanie. Jednoznaczność i wynik odpowiedzi są danymi wejściowymi, nie analizą cytatu."
  frame: "P01–P05 nie zmieniają kind/about/about_version/requested_transition/blocking/age; P03 nie tworzy DEC. T05/T07 atomowo ustawiają consumed=true ze zmianą produktu; błąd nie zużywa zgody."

question_transitions:
  - id: P00
    name: raise
    from: [none]
    to: open
    actor: [A, R, U]
    guard: "true"
    effects: []
    iso: [PM.02.02, PM.03.03]

  - id: P01
    name: ask
    from: [open]
    to: asked
    actor: A
    guard: "count(asked) = 0 and q = oldest(open, blocking_first)"
    effects: []
    iso: [PM.02.05]
    description: "jedna decyzja na wiadomość (WSPOLPRACA §3); FIFO z pierwszeństwem blokujących zapobiega zagłodzeniu"

  - id: P02
    name: resolve
    from: [asked]
    to: resolved
    actor: U
    guard: "unambiguous_answer"
    effects: ["resolution := answer_resolution(q)", "record DEC with user quote"]
    iso: [PM.02.03, PM.03.04, PM.O4]

  - id: P03
    name: answer_ambiguously
    from: [asked]
    to: open
    actor: U
    guard: "true"
    effects: []
    iso: [PM.02.05]
    description: "nie tworzy DEC (INT-010, lekcja DEC-VCS-021); pytanie wraca do kolejki jako najstarsze"

  - id: P04
    name: defer_question
    from: [open, asked]
    to: deferred
    actor: U
    guard: "not blocking"
    effects: []
    iso: [PM.03.04]

  - id: P05
    name: resume_question
    from: [deferred]
    to: open
    actor: [U, A]
    guard: "true"
    effects: []
    iso: [PM.03.04]
    description: "agent wznawia na początku etapu, któremu pytanie przypisano"

# ---------------------------------------------------------------------------
# Wydanie (linia bazowa produktu i odbiór)
# ---------------------------------------------------------------------------

release_states:
  in_preparation: {final: false}
  ready:          {final: false}
  reviewed:       {final: false}
  accepted:       {final: true}

# DEC-PRO-003 / INT-017: produkty robocze są zmienne, odebrane wydania są migawkami.
release_variables:
  number:     {type: positive_int, initial: 1, description: "tożsamość rekordu; kolejne wydanie otrzymuje poprzedni numer + 1"}
  state:      {type: release_states, initial: in_preparation}
  scope:      {type: item_id_set, initial: test_instance.release_scope, description: "własna kopia zbioru ID, nie alias zakresu poprzedniego wydania"}
  snapshot:   {type: item_snapshot, initial: none, description: "migawka z chwili W04; poza accepted brak migawki odbioru"}
  acceptance: {type: acceptance_record, initial: none, description: "numer wydania i cytat użytkownika zapisane w W04"}

release_control_variables:
  releases: {type: "map[positive_int, release_variables]", initial: "{1: initial release_variables}", description: "historia rekordów; odebranych rekordów nie usuwamy ani nie nadpisujemy"}
  current_release: {type: positive_int, initial: 1, description: "klucz najnowszego rekordu; jedyne wydanie, na którym mogą działać W01–W05"}
  next_release_required: {type: bool, initial: false, description: "trwały znacznik zmiany po odbiorze; poza odebranym rekordem; kasuje go wyłącznie W06"}

release_semantics:
  default_target: "W01–W05 i W07 zmieniają releases[current_release]; accepted jest końcowe dla konkretnego rekordu"
  new_release_target: "W06 czyta stary rekord, lecz from/to opisują zmianę bieżącego wydania: to i skutki dotyczą nowego rekordu numer n + 1; stary rekord pozostaje identyczny"
  frame: "pola niewymienione w skutkach pozostają bez zmian; T i P zmieniają produkty robocze i pytania, nigdy zapisane migawki. depends_on po inicjalizacji zmienia wyłącznie T14; predecessor zapisuje tylko T00; scope istniejącego rekordu zmienia tylko W07 w in_preparation"
  scope_copy: "W06 kopiuje scope poprzedniego wydania, włącznie z elementami wyłączonymi z dostawy; nie zatwierdza nowego zakresu ani zmian produktów"
  pending_priority: "gdy next_release_required = true, następnym przejściem jest W06; nie wolno pominąć W06 po cofnięciu flagi suspect"
  bounds: "max_releases jest granicą eksploracji, nie warunkiem W06 w procesie; próba utworzenia wydania poza granicą to granica badania, nie zakleszczenie ani dowód zakończenia"

release_transitions:
  - id: W01
    name: declare_ready
    from: [in_preparation]
    to: ready
    actor: A
    guard: "forall e: in_scope(e) => (e.state in {baselined, deferred, superseded, withdrawn} and (e.state = baselined => not e.suspect)) and tests_ok and not exists q: q.blocking and q.state in {open, asked}"
    effects: []
    iso: [SI.05.11, SI.06.05, SI.06.06, SI.O5, SI.O6]
    description: "elementy odłożone, zastąpione i wycofane wypadają z wydania; muszą mieć zapis w rejestrze pytań lub DEC"

  - id: W02
    name: review_pass
    from: [ready]
    to: reviewed
    actor: R
    guard: "true"
    effects: []
    iso: [SI.O7]

  - id: W03
    name: review_findings
    from: [ready]
    to: in_preparation
    actor: R
    guard: "true"
    effects: ["for each finding: P00 raise (blocking = true)"]
    iso: [SI.O7, PM.03.02]

  - id: W04
    name: accept
    from: [reviewed]
    to: accepted
    actor: U
    guard: "true"
    effects: ["release.snapshot := snapshot(release.scope)", "release.acceptance := record acceptance with release.number and user quote"]
    iso: [PM.04.01, PM.04.02, PM.O2]

  - id: W05
    name: reject_acceptance
    from: [reviewed]
    to: in_preparation
    actor: U
    guard: "true"
    effects: ["P00 raise (blocking = true)"]
    iso: [PM.04.01]

  - id: W06
    name: open_next_release
    from: [accepted]
    to: in_preparation
    target: new_release
    actor: A
    guard: "next_release_required"
    effects:
      - "n := current_release"
      - "releases[n + 1] := {number: n + 1, state: in_preparation, scope: copy(releases[n].scope), snapshot: none, acceptance: none}"
      - "current_release := n + 1"
      - "next_release_required := false"
    iso: [SI.06.05, PM.04.01, PCM.02.04]
    interpretation: INT-017
    description: "techniczne otwarcie następnego wydania po T05–T10 w zakresie lub pojawieniu się suspect w zakresie po odbiorze; bez zmiany odebranego rekordu i bez zastępowania bramek U (DEC-PRO-003, DEC-PRO-004)"

  - id: W07
    name: include_replacement
    from: [in_preparation]
    to: "="
    actor: U
    arguments:
      item: {bind: e, type: item}
    guard: "not in_scope(e) and e.state = baselined and not e.suspect and not e.predecessor = none and predecessor(e).state = superseded and in_scope(predecessor(e)) and forall d in deps(e): in_scope(d)"
    effects: ["release.scope := release.scope union {e.id}"]
    evidence: "DEC z cytatem użytkownika"
    iso: [PM.02.03, PM.03.04, SI.06.05]
    interpretation: INT-018
    description: "U włącza wskazanego następcę do przygotowywanego wydania; poprzednik zostaje w zakresie jako superseded, wcześniejsze odbiory bez zmian"

# Skutek pomocniczy używany przez T05–T10 i T14.
helper_effects:
  invalidate_release(e): "jeśli in_scope(e) i release.state in {ready, reviewed}: release.state := in_preparation; jeśli in_scope(e) i release.state = accepted: next_release_required := true, bez zmiany odebranego rekordu"

# Obserwator jest atomową częścią kroku, po skutkach przejścia, przed kolejnym krokiem.
post_step_effects:
  - id: detect_post_acceptance_change
    guard: "release.state = accepted and exists e in newly_suspect: in_scope(e)"
    effects: ["next_release_required := true"]
    description: "wychwytuje także wpływ zmiany elementu spoza zakresu na element z zakresu; znacznik nie znika po przeglądzie bez wpływu"

# ---------------------------------------------------------------------------
# Instancja do kontroli modelu (hipoteza małego zakresu)
# ---------------------------------------------------------------------------

test_instance:
  items:
    p1: {type: PLAN, depends_on: []}
